<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{notFound.title}}</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="64x64" href="/assets/img/apple-touch-icon.png">
</head>
<body>
<nav class="nav-minimal">
  <a href="{{homeUrl}}" class="nav-logo">{{nav.logo}}</a>
  {{langSwitcher}}
</nav>
<main id="main">
  <section class="notfound">
    <p class="notfound-code" aria-hidden="true">404</p>
    <p class="section-label">{{notFound.label}}</p>
    <h1 class="notfound-heading">{{{notFound.heading}}}</h1>
    <p class="notfound-desc">{{notFound.desc}}</p>
    <div class="notfound-actions">
      <a href="{{homeUrl}}" class="btn-primary">{{notFound.home}} {{arrowLg}}</a>
      <a href="{{homeUrl}}#methods" class="btn-secondary">{{notFound.methods}} {{arrowSm}}</a>
    </div>
    <p class="notfound-contact">
      <span>{{notFound.contactLead}}</span>
      <a href="tel:{{phoneHref}}">{{contact.phone}}</a>
      <a href="{{contact.instagramUrl}}" rel="me noopener" target="_blank">{{contact.instagramHandle}}</a>
    </p>
  </section>
</main>
{{> footer}}
</body>
</html>
