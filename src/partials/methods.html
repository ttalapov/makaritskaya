<section class="methods" id="methods">
  <div class="methods-header reveal">
    <p class="section-label">{{methods.label}}</p>
    <h2 class="section-heading">{{{methods.heading}}}</h2>
    <p class="section-sub">{{methods.sub}}</p>
  </div>
  <div class="methods-grid">
{{methodGroupsHtml}}
  </div>
  <details class="methods-all">
    <summary class="methods-all-summary">{{methods.allSummary}}</summary>
    <dl class="methods-all-list">
{{methodsAllHtml}}
    </dl>
  </details>
</section>
