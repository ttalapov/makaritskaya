<section class="faq" id="faq">
  <div class="faq-inner">
    <div class="faq-header">
      <p class="section-label reveal">{{faq.label}}</p>
      <h2 class="section-heading reveal reveal-delay-1">{{{faq.heading}}}</h2>
      <p class="section-sub reveal reveal-delay-2">{{faq.sub}}</p>
    </div>
    <div class="faq-list reveal reveal-delay-1">
{{faqHtml}}
    </div>
  </div>
</section>
