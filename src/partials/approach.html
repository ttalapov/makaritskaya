<section class="approach" id="approach">
  <div class="approach-grid">
    <div>
      <p class="section-label reveal">{{approach.label}}</p>
      <h2 class="section-heading reveal reveal-delay-1">{{{approach.heading}}}</h2>
      <p class="section-sub reveal reveal-delay-2">{{approach.sub}}</p>
      <div class="approach-steps reveal reveal-delay-3">
{{stepsHtml}}
      </div>
    </div>
    <div class="approach-features reveal reveal-delay-2">
{{featuresHtml}}
    </div>
  </div>
</section>
