<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<link rel="canonical" href="{{canonical}}">
{{hreflangLinks}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{meta.siteName}}">
<meta property="og:locale" content="{{ogLocale}}">
{{ogLocaleAlternates}}
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{meta.title}}">
<meta property="og:description" content="{{meta.description}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{meta.ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{meta.title}}">
<meta name="twitter:description" content="{{meta.description}}">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="twitter:image:alt" content="{{meta.ogImageAlt}}">
<link rel="stylesheet" href="{{cssHref}}">
<link rel="preload" as="image" type="image/avif" fetchpriority="high"
      imagesrcset="/assets/img/hero-yuliia-240.avif 240w, /assets/img/hero-yuliia-334.avif 334w"
      imagesizes="(max-width: 480px) 240px, (max-width: 768px) 280px, (max-width: 1024px) 300px, 334px">
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="64x64" href="/assets/img/apple-touch-icon.png">
</head>
