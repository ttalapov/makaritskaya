<section class="contact" id="contact">
  <div class="contact-inner">
    <div>
      <p class="section-label reveal">{{contact.label}}</p>
      <h2 class="section-heading reveal reveal-delay-1">{{{contact.heading}}}</h2>
      <p class="section-sub reveal reveal-delay-2">{{contact.sub}}</p>
    </div>
    <div class="contact-info-items reveal reveal-delay-2">
      <a href="tel:{{phoneHref}}" class="contact-row">
        <div class="contact-icon" aria-hidden="true">{{iconPhone}}</div>
        <div>
          <div class="contact-label">{{contact.phoneLabel}}</div>
          <div class="contact-val">{{contact.phone}}</div>
        </div>
      </a>
      <a href="{{contact.instagramUrl}}" class="contact-row" rel="me noopener" target="_blank">
        <div class="contact-icon" aria-hidden="true">{{iconInstagram}}</div>
        <div>
          <div class="contact-label">Instagram</div>
          <div class="contact-val">{{contact.instagramHandle}}</div>
        </div>
      </a>
      <div class="contact-row">
        <div class="contact-icon" aria-hidden="true">{{iconPin}}</div>
        <div>
          <div class="contact-label">{{contact.cityLabel}}</div>
          <div class="contact-val">{{contact.cityVal}}</div>
        </div>
      </div>
      <div class="contact-row">
        <div class="contact-icon" aria-hidden="true">{{iconClock}}</div>
        <div>
          <div class="contact-label">{{contact.hoursLabel}}</div>
          <div class="contact-val">{{contact.hoursVal}}</div>
        </div>
      </div>
    </div>
  </div>
</section>
